<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate - Taliq</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/certificate.css">
    <script src="../js/certificate.js"></script>
</head>
<body>
    <div class="cert-page">
        <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>

        <div class="certificate" id="certificate-card">
            <div class="cert-logo">Taliq</div>

            <div class="cert-badge">🏆</div>

            <p class="cert-label">Certificate of Completion</p>
            <h1 class="cert-title">Certificate of Completion</h1>

            <p class="cert-presented">This certificate is proudly presented to</p>
            <div class="cert-name" id="cert-name">—</div>

            <p class="cert-desc">for successfully completing the course</p>
            <div class="cert-course" id="cert-course">—</div>

            <div class="cert-divider"></div>

            <div class="cert-footer">
                <div class="cert-sig">
                    <div class="sig-line"></div>
                    <strong>Taliq Platform</strong>
                    <p>Authorized Signature</p>
                </div>
                <div class="cert-id">
                    <p>Date of Issue</p>
                    <strong id="cert-date">—</strong>
                    <p>Certificate ID</p>
                    <strong id="cert-code">—</strong>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
