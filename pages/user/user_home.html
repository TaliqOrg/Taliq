<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Global Styling -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/progress_sync.js"></script>
    <script src="../../js/courses.js"></script>
    <script src="../../js/user_home.js"></script>
</head>

<body>
    
    <div id="header-placeholder"></div>

    <main>

        <!-- Welcome Banner -->
        <section class="container mt-custom">

            <div class="home-banner">
                <h1 class="home-title">Welcome Back, <span data-user-name>User</span>!</h1>
                <p class="home-subtitle">Access your enrolled courses or continue exploring the shop</p>
            </div>

        </section>

        <!-- Continue Learning Section -->
        <section class="container py-custom">

            <!-- heading -->
            <div class="past-purchases-container py-custom">
                <h2>Continue Learning</h2>
                <a href="profile.html#my-courses" class="view-all">View All Courses</a>
            </div>

            <!-- In-progress courses -->
            <div class="purchased-courses-container" id="continue-learning-container">
                <p class="loading-text">Loading your courses...</p>
            </div>
        </section>

        <!-- view past purchases -->
        <section class="container py-custom">

            <!-- heading -->
            <div class="past-purchases-container py-custom">
                <h2>View Past Purchases</h2>
                <a href="profile.html#orders" class="view-all">View All</a>
            </div>

            <!-- purchased courses -->
            <div class="purchased-courses-container" id="recent-purchases-container">
                <p class="loading-text">Loading recent purchases...</p>
            </div>
        </section>

        <!-- Recommended Courses Section -->
        <section class="container py-custom" id="featured-courses" style="scroll-margin-top: 80px;">

            <!-- Header -->
            <div class="section-header">
                <div>
                    <h2 style="margin-bottom: 1rem;">Recommended For You</h2>
                    <p class="section-subtitle">Discover our top-rated courses.</p>
                </div>
            </div>

            <!-- A grid container to display course cards as links -->
            <div class="product-grid" id="course-container" data-limit="4">
            </div>

            <!-- A container to show "View All Courses" button -->
            <div class="view-all-container">
                <a href="../explore.html" class="btn btn-secondary">View All 120+ Courses</a>
            </div>

        </section>

    </main>

    <div id="footer-placeholder"></div>

</body>

</html>
