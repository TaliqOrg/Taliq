<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Taliq </title>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">
    <link rel="stylesheet" href="../../css/cart.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>


<main>

    <h1 class="container mt-custom" class="section-title">Your Cart</h1>


    <section class="container pb-custom">

        <div class="welcome-card cart-layout">

            <div class="cart-items">

                <a href="../course_details.html" class="past-purchases-container cart-item">
                    <div class="purchased-courses-container">
                        <div class="card-image-container cart-img-wrapper">
                            <img src="../../images/data_mastery_and_analysis.png" alt="Data Science Course" class="card-img">
                        </div>
                        <div>
                            <h3 class="card-title cart-item-title">Data Mastery & Analysis</h3>
                            <span class="badge badge-online cart-badge-static">Online</span>
                        </div>
                    </div>
                    <div class="card-footer cart-item-actions">
                        <span class="price">450 SAR</span>
                        <button class="cart-btn" title="Remove Item"><span class="material-symbols-outlined">delete</span></button>
                    </div>
                </a>

                <a href="../course_details.html" class="past-purchases-container cart-item">
                    <div class="purchased-courses-container">
                        <div class="card-image-container cart-img-wrapper">
                            <img src="../../images/leadership_in_practice.png" alt="Business Workshop" class="card-img">
                        </div>
                        <div>
                            <h3 class="card-title cart-item-title">Leadership In Practice</h3>
                            <span class="badge badge-onsite cart-badge-static">On-site</span>
                        </div>
                    </div>
                    <div class="card-footer cart-item-actions">
                        <span class="price">850 SAR</span>
                        <button class="cart-btn" title="Remove Item"><span class="material-symbols-outlined">delete</span></button>
                    </div>
                </a>

            </div>

            <div>
                <div class="product-card cart-summary-card">
                    <div class="card-content">
                        <h3 class="card-title summary-heading">Order Summary</h3>

                        <div class="past-purchases-container summary-line">
                            <span class="section-subtitle">Original Price</span>
                            <span class="rating-score">1300 SAR</span>
                        </div>

                        <div class="past-purchases-container summary-line">
                            <span class="section-subtitle">Discounts</span>
                            <span class="rating-score text-primary">0 SAR</span>
                        </div>

                        <hr class="summary-divider">

                        <div class="past-purchases-container summary-total-line">
                            <span class="card-title summary-total-text">Total</span>
                            <span class="price">1300 SAR</span>
                        </div>

                        <a href="checkout.html" class="btn btn-primary btn-checkout">
                            Checkout
                            <span class="material-symbols-outlined">arrow_forward</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </section>

</main>

    <div id="footer-placeholder"></div>


</body>
</html>
