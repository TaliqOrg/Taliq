<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Taliq</title>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">
    <link rel="stylesheet" href="../../css/cart.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/cart.js"></script>
</head>
<body>

    <div id="header-placeholder"></div>

    <main>

        <div class="container mt-custom cart-header">
            <h1>Your Cart</h1>
            <button onclick="emptyCart()" class="btn btn-empty-cart">
                <span class="material-symbols-outlined">delete_sweep</span>
                Empty Cart
            </button>
        </div>

        <section class="container pb-custom">

            <div class="welcome-card cart-layout">

                <!-- Left side: cart items loaded dynamically by cart.js -->
                <div class="cart-items" id="cart-items-container">
                    <p style="color: var(--text-muted);">Loading your cart...</p>
                </div>

                <!-- Right side: order summary -->
                <div>
                    <div class="card cart-summary-card">
                        <div class="card-content">
                            <h3 class="card-title summary-heading">Order Summary</h3>

                            <div class="past-purchases-container summary-line">
                                <span class="section-subtitle">Original Price</span>
                                <span class="rating-score" id="cart-original-price">0.00 SAR</span>
                            </div>

                            <div class="past-purchases-container summary-line">
                                <span class="section-subtitle">Discounts</span>
                                <span class="rating-score text-primary">0 SAR</span>
                            </div>

                            <hr class="summary-divider">

                            <div class="past-purchases-container summary-total-line">
                                <span class="card-title summary-total-text">Total</span>
                                <span class="price" id="cart-total-price">0.00 SAR</span>
                            </div>

                            <a href="checkout.html" class="btn btn-primary btn-checkout">
                                Checkout
                                <span class="material-symbols-outlined">arrow_forward</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

</body>
</html>
