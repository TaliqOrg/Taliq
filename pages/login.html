<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Taliq</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Global Styling -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/welcome_page.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
</head>

<body>

    <div id="header-placeholder"></div>

    <!-- flexbox layouts -->
    <main class="split-layout">

        <!-- Login Form Side -->
        <div class="login-pane">
            
            <div class="login-content">

                <h1 class="login-title" style="margin-bottom: 3rem;">Log in to Taliq</h1>
                
                <!-- Form Section -->
                <form id="loginForm" class="login-form">

                    <!-- Error Message -->
                    <div id="errorMessage" class="error-message" role="alert" aria-live="assertive"></div>

                    <!-- Email Field -->
                    <div class="input-group">
                        <label for="email" class="input-label">Email Address</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon" aria-hidden="true">mail</span>
                            <input type="email" id="email" class="form-input" placeholder="Enter your email" required aria-required="true">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="password" class="input-label">Password</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon" aria-hidden="true">lock</span>
                            <input type="password" id="password" class="form-input" placeholder="Enter your password"
                                required aria-required="true">
                        </div>
                    </div>

                    <!-- Remember me & Forgot Password options -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" class="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="forgot_password.html" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit" id="loginBtn">Log In</button>

                </form>

                <p class="signup-prompt">
                    Don't have an account? <a href="signup.html" class="signup-link">Sign up</a>
                </p>

            </div>
        </div>

        <!-- Image Area -->
        <div class="image-pane">
            <img src="../images/login_image.png" alt="Learning Platform Image"
                class="pane-image" style=" padding: 4rem;">
        </div>

    </main>

    <div id="footer-placeholder"></div>

</body>
</html>
