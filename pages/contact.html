<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/welcome_page.css" />
    <link rel="stylesheet" href="../css/user_home.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/contact.css" />

    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
  </head>

  <body>
    <!-- Navbar -->
    <div id="header-placeholder"></div>

    <main class="container py-custom contact-main">
      <div class="login-pane">
        <div class="login-content">
          <h1 class="login-title">Let's get in touch</h1>

          <form action="user/user_home.html" method="" class="login-form">
            <div class="input-group">
              <p for="username" class="input-label">Name</p>
              <div class="input-wrapper">
                <span class="material-symbols-outlined input-icon">person</span>
                <input
                  type="text"
                  id="username"
                  class="form-input"
                  placeholder="Enter your username"
                />
              </div>
            </div>

            <div class="input-group">
              <p for="user-email" class="input-label">Email address *</p>
              <div class="input-wrapper">
                <span class="material-symbols-outlined input-icon">email</span>
                <input
                  type="email"
                  id="user-email"
                  class="form-input"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <p for="subject" class="input-label">Subject *</p>
              <div class="input-wrapper">
                <span class="material-symbols-outlined input-icon"
                  >subject</span
                >
                <input
                  type="text"
                  id="subject"
                  class="form-input"
                  placeholder="Enter your subject"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <p for="message" class="input-label">Message *</p>
              <div class="input-wrapper">
                <span class="material-symbols-outlined input-icon"
                  >message</span
                >
                <textarea id="message" class="form-input" required></textarea>
              </div>
            </div>

            <button type="submit" class="btn-submit">Send</button>
          </form>
        </div>
      </div>
      <div class="contact-map">
        <div id="map" style="height: 400px; width: 100%; border-radius: 8px;"></div>
        <div class="contact-method">
          <a
            href="https://www.google.com/maps/place/College+of+Computer+Science+and+Information+Technology/@26.3948879,50.1957014,17z/data=!3m1!4b1!4m6!3m5!1s0x3e49ef811304efab:0xe664343a49ebbf2b!8m2!3d26.3948879!4d50.1957014!16s%2Fg%2F1q5bxv2b_?entry=ttu&g_ep=EgoyMDI2MDQyNi4wIKXMDSoASAFQAw%3D%3D"
          >
            <img
              src="../images/location-pin-svgrepo-com.svg"
              alt="location pin"
            />
            <p>
              Building A11, CCSIT, Imam Abdulrahman bin Faisal University,
              Dammam
            </p>
          </a>
        </div>
      </div>
    </main>
    <div id="footer-placeholder"></div>
    
    <script>
      const map = L.map('map').setView([26.3948879, 50.1957014], 16);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);
      
      const marker = L.marker([26.3948879, 50.1957014]).addTo(map);
      marker.bindPopup('<b>CCSIT</b><br>Building A11, Imam Abdulrahman bin Faisal University').openPopup();
    </script>
  </body>
</html>
