<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course Details - Admin</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Global Styling -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">
    <link rel="stylesheet" href="../../css/checkout.css">
    <link rel="stylesheet" href="../../css/admin_home.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/admin_edit_course.js"></script>
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <!-- Page Header & Back Button -->
        <section class="container mt-custom">
            <div class="section-header">
                <a href="manage_courses.html" class="back-link">
                    <span class="material-symbols-outlined">arrow_back</span> Back to Manage Courses
                </a>
                <h1 class="section-title">Edit Course Details</h1>
                <p class="section-subtitle">Update metadata for: <strong>Data Mastery & Analysis</strong></p>
            </div>
        </section>

        <!-- Course Edit Form -->
        <section class="container pb-custom">
            <div class="checkout-layout">

                <div class="checkout-card">
                    <h3 class="checkout-card-title">
                        <span class="material-symbols-outlined text-primary">edit_document</span> Update Information
                    </h3>

                    <div id="form-message" style="display:none; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.9rem;"></div>

                    <form id="edit-course-form" class="form-group-list">

                        <!-- Course Type (read-only) -->
                        <div>
                            <label class="checkout-label">Course Type</label>
                            <p id="course-type-label" style="font-weight: 600; padding: 0.5rem 0;"></p>
                        </div>

                        <!-- Title & Category -->
                        <div class="form-row">
                            <div class="form-col">
                                <label class="checkout-label" for="title">Course Title</label>
                                <input type="text" id="title" name="Title" class="checkout-input" required>
                            </div>
                            <div class="form-col">
                                <label class="checkout-label" for="category">Category</label>
                                <select id="category" name="CategoryId" class="checkout-input" required>
                                    <option value="" disabled selected>Select a category</option>
                                    <option value="1">Data Science</option>
                                    <option value="2">Business &amp; Management</option>
                                    <option value="3">Technology &amp; Programming</option>
                                    <option value="4">Design &amp; Creativity</option>
                                </select>
                            </div>
                        </div>

                        <!-- Description -->
                        <div>
                            <label class="checkout-label" for="description">Description</label>
                            <textarea id="description" name="Description" class="checkout-input" rows="5" required></textarea>
                        </div>

                        <!-- Price & Duration & Seats -->
                        <div class="form-row">
                            <div class="form-col">
                                <label class="checkout-label" for="price">Price in SAR</label>
                                <input type="number" id="price" name="Price" step="0.01" class="checkout-input" required>
                            </div>
                            <div class="form-col">
                                <label class="checkout-label" for="duration">Duration (Hours)</label>
                                <input type="number" id="duration" name="DurationHours" class="checkout-input" required>
                            </div>
                            <div class="form-col">
                                <label class="checkout-label" for="max_students">Number of Seats</label>
                                <input type="number" id="max_students" name="MaxStudents" min="0" class="checkout-input" required>
                            </div>
                        </div>

                        <!-- Level & Language -->
                        <div class="form-row">
                            <div class="form-col">
                                <label class="checkout-label" for="level">Level</label>
                                <select id="level" name="Level" class="checkout-input" required>
                                    <option value="" disabled selected>Select level</option>
                                    <option value="Beginner">Beginner</option>
                                    <option value="Intermediate">Intermediate</option>
                                    <option value="Advanced">Advanced</option>
                                </select>
                            </div>
                            <div class="form-col">
                                <label class="checkout-label" for="language">Language</label>
                                <select id="language" name="Language" class="checkout-input" required>
                                    <option value="" disabled selected>Select language</option>
                                    <option value="English">English</option>
                                    <option value="Arabic">Arabic</option>
                                </select>
                            </div>
                        </div>

                        <!-- Location (workshops only) -->
                        <div id="location-field" style="display: none;">
                            <label class="checkout-label" for="location">Location</label>
                            <input type="text" id="location" name="Location" class="checkout-input" placeholder="e.g., Building A, Room 101">
                        </div>

                        <!-- Thumbnail -->
                        <div>
                            <label class="checkout-label" for="thumbnail">Thumbnail Image</label>
                            <input type="file" id="thumbnail" name="ThumbnailImage" class="checkout-input" accept="image/*">
                        </div>

                        <!-- Published Status -->
                        <div class="publish-section">
                            <div>
                                <label class="checkout-label" for="isPublished">Publish Course</label>
                                <p class="publish-desc">Make this course
                                    visible to students in the catalog.</p>
                            </div>

                            <input type="checkbox" id="isPublished" name="IsPublished" checked>

                        </div>

                        <hr class="summary-divider">

                        <!-- Action Buttons -->
                        <div class="form-actions">
                            <a href="manage_courses.html" class="btn btn-outline">Cancel</a>
                            <button type="submit" id="submit-btn" class="btn btn-primary">
                                <span class="material-symbols-outlined">save</span> Save Changes
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

</body>

</html>
