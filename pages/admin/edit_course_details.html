<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course Details - Admin</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Global Styling -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">
    <link rel="stylesheet" href="../../css/checkout.css">
    <link rel="stylesheet" href="../../css/admin_home.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <!-- Page Header & Back Button -->
        <section class="container mt-custom">
            <div class="section-header">
                <a href="manage_courses.html" class="back-link">
                    <span class="material-symbols-outlined">arrow_back</span> Back to Manage Courses
                </a>
                <h1 class="section-title">Edit Course Details</h1>
                <p class="section-subtitle">Update metadata for: <strong>Data Mastery & Analysis</strong></p>
            </div>
        </section>

        <!-- Course Edit Form -->
        <section class="container pb-custom">
            <div class="checkout-layout">

                <div class="checkout-card">
                    <h3 class="checkout-card-title">
                        <span class="material-symbols-outlined text-primary">edit_document</span> Update Information
                    </h3>

                    <!-- Form with existing database values -->
                    <form action="manage_courses.html" class="form-group-list">

                        <!-- Title & Category -->
                        <div class="form-row">
                            <div class="form-col">
                                <label class="checkout-label" for="title">Course Title</label>
                                <input type="text" id="title" name="Title" class="checkout-input"
                                    value="Data Mastery & Analysis" required>
                            </div>
                            <div class="form-col">
                                <label class="checkout-label" for="category">Category</label>
                                <select id="category" name="CategoryId" class="checkout-input" required>
                                    <option value="1">Technology</option>
                                    <option value="2">Business</option>
                                    <option value="3">Design</option>
                                    <option value="4" selected>Data Science</option>
                                </select>
                            </div>
                        </div>

                        <!-- Description -->
                        <div>
                            <label class="checkout-label" for="description">Description</label>
                            <textarea id="description" name="Description" class="checkout-input" rows="5"
                                required>Master the fundamentals of data analysis and visualization with this comprehensive course. Learn to work with large datasets, perform statistical analysis, and create compelling visualizations that tell a story.</textarea>
                        </div>

                        <!-- Price & Duration -->
                        <div class="form-row">
                            <div class="form-col">
                                <label class="checkout-label" for="price">Price in SAR</label>
                                <input type="number" id="price" name="Price" step="0.01" class="checkout-input"
                                    value="450.00" required>
                            </div>
                            <div class="form-col">
                                <label class="checkout-label" for="duration">Duration (Hours)</label>
                                <input type="number" id="duration" name="DurationHours" class="checkout-input"
                                    value="40" required>
                            </div>
                        </div>

                        <!-- Level & Language -->
                        <div class="form-row">
                            <div class="form-col">
                                <label class="checkout-label" for="level">Level</label>
                                <select id="level" name="Level" class="checkout-input" required>
                                    <option value="Beginner">Beginner</option>
                                    <option value="Intermediate" selected>Intermediate</option>
                                    <option value="Advanced">Advanced</option>
                                </select>
                            </div>
                            <div class="form-col">
                                <label class="checkout-label" for="language">Language</label>
                                <select id="language" name="Language" class="checkout-input" required>
                                    <option value="English" selected>English</option>
                                    <option value="Arabic">Arabic</option>
                                </select>
                            </div>
                        </div>

                        <!-- Thumbnail -->
                        <div>
                            <label class="checkout-label" for="thumbnail">Thumbnail Image</label>
                            <input type="file" id="thumbnail" name="Thumbnail" class="checkout-input"
                                value="https://images.unsplash.com/photo-1551288049-bebda4e38f71?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80">
                        </div>

                        <!-- Published Status -->
                        <div class="publish-section">
                            <div>
                                <label class="checkout-label" for="isPublished">Publish Course</label>
                                <p class="publish-desc">Make this course
                                    visible to students in the catalog.</p>
                            </div>

                            <input type="checkbox" id="isPublished" name="IsPublished" checked>

                        </div>

                        <hr class="summary-divider">

                        <!-- Action Buttons -->
                        <div class="form-actions">
                            <a href="manage_courses.html" class="btn btn-outline">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <span class="material-symbols-outlined">save</span> Save Changes
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

</body>

</html>
