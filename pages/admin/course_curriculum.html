<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Curriculum - Admin</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">
    <link rel="stylesheet" href="../../css/checkout.css">
    <link rel="stylesheet" href="../../css/admin_home.css">
    <link rel="stylesheet" href="../../css/course_curriculum.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/course_curriculum.js"></script>
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="container mt-custom">
            <div class="section-header">
                <a href="manage_courses.html" class="back-link">
                    <span class="material-symbols-outlined">arrow_back</span> Back to Manage Courses
                </a>
                <h1 class="section-title">Manage Curriculum</h1>
                <p class="section-subtitle">Editing lessons for: <strong id="course-title-display">Loading...</strong>
                </p>
            </div>
        </section>

        <section class="container pb-custom">
            <div class="curriculum-layout">

                <div class="curriculum-list-section">
                    <h3>Current Lessons</h3>

                    <div id="lessons-container">
                        <p style="padding: 1rem; color: #6b7280;">Loading lessons...</p>
                    </div>
                </div>

                <div class="curriculum-form-section">
                    <div class="checkout-card">
                        <h3 class="checkout-card-title">
                            <span class="material-symbols-outlined text-primary">add_box</span> Add New Lesson
                        </h3>

                        <form id="lesson-form" class="form-group-list">
                            <input type="hidden" id="lessonId" name="LessonId">

                            <div>
                                <label class="checkout-label" for="lessonTitle">Lesson Title</label>
                                <input type="text" id="lessonTitle" name="Title" class="checkout-input"
                                    placeholder="e.g., Data Cleaning Basics" required>
                            </div>

                            <div>
                                <label class="checkout-label" for="lessonDesc">Description</label>
                                <textarea rows="5" id="lessonDesc" name="Description" class="checkout-input"
                                    placeholder="Brief description of the lesson content..." required></textarea>
                            </div>

                            <div class="form-row">
                                <div class="form-col">
                                    <label class="checkout-label" for="contentType">Content Type</label>
                                    <select id="contentType" name="ContentType" class="checkout-input" required>
                                        <option value="video">Video</option>
                                        <option value="document">Document (PDF/Article)</option>
                                        <option value="quiz">Quiz</option>
                                    </select>
                                </div>
                                <div class="form-col">
                                    <label class="checkout-label" for="duration">Duration (Minutes)</label>
                                    <input type="number" id="duration" name="Duration" class="checkout-input"
                                        placeholder="e.g., 15" required>
                                </div>
                            </div>

                            <div>
                                <label class="checkout-label" for="contentUrl">Content URL</label>
                                <input type="url" id="contentUrl" name="ContentUrl" class="checkout-input"
                                    placeholder="https://video-host.com/lesson-link" required>
                            </div>

                            <div>
                                <label class="checkout-label" for="orderNum">Order Number</label>
                                <input type="number" id="orderNum" name="SortOrder" class="checkout-input" value="1"
                                    required>
                            </div>

                            <hr class="summary-divider">

                            <button type="submit" class="btn btn-primary btn-full">
                                <span class="material-symbols-outlined">save</span> Save Lesson
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

</body>

</html>
