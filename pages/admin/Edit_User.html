<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">
    <link rel="stylesheet" href="../../css/checkout.css">
    <link rel="stylesheet" href="../../css/admin_home.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/admin_edit_user.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="container mt-custom">
            <div class="section-header">
                <a href="manage_users.html" class="back-link">
                    <span class="material-symbols-outlined">arrow_back</span> Back to Manage Users
                </a>
                <h1 class="section-title">Edit User Details</h1>
                <p class="section-subtitle">Update metadata for: <strong id="user-name-display">Loading...</strong></p>
            </div>
        </section>

        <section class="container pb-custom">
            <div class="checkout-layout" style="display: block;">
                <div class="checkout-card">
                    <h3 class="checkout-card-title">
                        <span class="material-symbols-outlined text-primary">edit_document</span> Update Information
                    </h3>

                    <form id="edit-user-form" class="form-group-list" autocomplete="off">
                        <div class="form-row">
                            <div class="form-col">
                                <label class="checkout-label" for="firstName">First Name</label>
                                <input type="text" id="firstName" class="checkout-input" required autocomplete="off">
                            </div>

                            <div class="form-col">
                                <label class="checkout-label" for="lastName">Last Name</label>
                                <input type="text" id="lastName" class="checkout-input" required autocomplete="off">
                            </div>

                            <div class="form-col">
                                <label class="checkout-label" for="role">Role</label>
                                <select id="role" class="checkout-input" required>
                                    <option value="admin">Admin</option>
                                    <option value="user">User</option>
                                    <option value="instructor">Instructor</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-col">
                            <label class="checkout-label" for="email">Email</label>
                            <input type="email" id="email" class="checkout-input" required autocomplete="off">
                        </div>

                        <div class="form-row" style="margin-top: 15px;">
                            <div class="form-col">
                                <label class="checkout-label" for="password">New Password (Leave blank to keep
                                    current)</label>
                                <input type="password" id="password" class="checkout-input" placeholder="******"
                                    autocomplete="new-password">
                            </div>

                            <div class="form-col">
                                <label class="checkout-label" for="confirmPassword">Confirm New Password</label>
                                <input type="password" id="confirmPassword" class="checkout-input" placeholder="******"
                                    autocomplete="new-password">
                            </div>
                        </div>

                        <hr class="summary-divider">

                        <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                            <a href="manage_users.html" class="btn btn-outline"
                                style="padding: 0.8rem 1.5rem; border: none;">Cancel</a>
                            <button type="submit" id="save-btn" class="btn btn-primary" style="padding: 0.8rem 2rem;">
                                <span class="material-symbols-outlined">save</span> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
</body>

</html>
