<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Global Styling -->
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">
    <link rel="stylesheet" href="../../css/checkout.css">
    <link rel="stylesheet" href="../../css/admin_home.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <!-- Page Header & Back Button -->
        <section class="container mt-custom">
            <div class="section-header">
                <a href="manage_users.html" class="back-link">
                    <span class="material-symbols-outlined">arrow_back</span> Back to Manage Users
                </a>
                <h1 class="section-title">Edit User Details</h1>
                <p class="section-subtitle">Update metadata for: <strong>Abdulhadi Shameea</strong></p>
            </div>
        </section>

        <section class="container pb-custom">
            <div class="checkout-layout" style="display: block;">
                <div class="checkout-card">
                    <h3 class="checkout-card-title">
                        <span class="material-symbols-outlined text-primary">edit_document</span> Update Information
                    </h3>

                    <form action="manage_users.html" class="form-group-list">
                        <div class="form-row">
                            <div class="form-col">
                                <label class="checkout-label" for="First Name">First Name</label>
                                <input type="text" id="First Name" name="First Name" class="checkout-input"
                                    value="Abdulhadi" required>
                            </div>

                            <div class="form-col">
                                <label class="checkout-label" for="Last Name">First Name</label>
                                <input type="text" id="Last Name" name="Last Name" class="checkout-input" value="Shamea"
                                    required>
                            </div>

                            <div class="form-col">
                                <label class="checkout-label" for="Role">Role</label>
                                <select id="Role" name="Role" class="checkout-input" required>
                                    <option value="1">Admin</option>
                                    <option value="2">Customer</option>
                                </select>
                            </div>
                        </div>


                        <div class="form-col">
                            <label class="checkout-label" for="Email">Email</label>
                            <span class="material-symbols-outlined">Email</span>
                            <input type="text" id="Email" name="Email" class="checkout-input"
                                value="2230006315@iau.edu.sa" required>
                        </div>

                        <div class="form-col">
                            <label class="checkout-label" for="Password">Password</label>
                            <input type="password" id="Password" name="Password" class="checkout-input"
                                placeholder="******">
                        </div>

                        <div class="form-col">
                            <label class="checkout-label" for="ConfirmPassword">Confirm Password</label>
                            <input type="password" id="ConfirmPassword" name="ConfirmPassword" class="checkout-input"
                                placeholder="******">
                        </div>



                        <hr class="summary-divider">

                        <!-- Action Buttons -->
                        <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                            <a href="manage_users.html" class="btn btn-outline"
                                style="padding: 0.8rem 1.5rem; border: none;">Cancel</a>
                            <button type="submit" class="btn btn-primary" style="padding: 0.8rem 2rem;">
                                <span class="material-symbols-outlined">save</span> Save Changes
                            </button>
                        </div>


                    </form>


                </div>
            </div>
        </section>





    </main>



    <div id="footer-placeholder"></div>


</body>

</html>
