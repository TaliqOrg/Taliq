<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses - Admin</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Global Styling -->
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/admin_home.css">
    <link rel="stylesheet" href="../../css/checkout.css">
    <link rel="stylesheet" href="../../css/manage_courses.css">

    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/manage_courses.js"></script>
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <!-- Page Header -->
        <section class="container mt-custom">
            <div class="section-header">
                <a href="admin_home.html" class="back-link">
                    <span class="material-symbols-outlined">arrow_back</span> Back to Dashboard
                </a>
                <h1 class="section-title">Manage Courses & Workshops</h1>
            </div>
        </section>

        <!-- Available Courses -->
        <section class="container pb-custom">

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-filters">
                    <div class="search-wrapper">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" class="filter-input" placeholder="Search by title...">
                    </div>
                    <select class="filter-select">
                        <option value="all">All Statuses</option>
                        <option value="published">Published</option>
                        <option value="draft">Drafts</option>
                    </select>
                    <select class="filter-select">
                        <option value="all">All Types</option>
                        <option value="course">Online Courses</option>
                        <option value="workshop">Workshops</option>
                    </select>
                </div>

                <a href="new_course.html" class="btn btn-primary">
                    <span class="material-symbols-outlined">add</span> Create New
                </a>
            </div>

            <!-- List of Courses -->
            <div class="admin-list-container"></div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

</body>

</html>
