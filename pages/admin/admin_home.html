<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Global Styling -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/welcome_page.css">
    <link rel="stylesheet" href="../../css/user_home.css">
    <link rel="stylesheet" href="../../css/admin_home.css">
    
    <script src="../../js/auth.js"></script>
    <script src="../../js/components.js"></script>
</head>

<body>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main>
        <!-- Welcome Banner -->
        <section class="container mt-custom">

            <div class="home-banner admin-home-banner">
                <h1 class="home-title text-primary banner-title">Platform Management</h1>
                <p class="home-subtitle banner-subtitle">Perform tasks and manage content.</p>
            </div>
        </section>

        <!-- Admin Action Layout -->
        <section class="container py-custom">

            <div class="section-header">
                <div>
                    <h2 class="section-title">Administrative Actions</h2>
                </div>
            </div>

            <!--  grid of action buttons for Admins -->
            <div class="admin-actions-grid">

                <a href="manage_courses.html" class="admin-action-card">
                    <span class="material-symbols-outlined action-icon">edit_document</span>

                    <div class="action-info">
                        <h3>Manage Courses</h3>
                        <p>View, edit, publish, or add lessons to existing courses and drafts.</p>
                    </div>
                </a>

                <a href="manage_users.html" class="admin-action-card">
                    <span class="material-symbols-outlined action-icon">manage_accounts</span>
                    <div class="action-info">
                        <h3>Manage Users</h3>
                        <p>Search, edit, or disable trainer and student accounts.</p>
                    </div>
                </a>

            </div>

        </section>

    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

</body>

</html>
