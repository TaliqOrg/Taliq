<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Courses - Taliq</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/welcome_page.css">
    <link rel="stylesheet" href="../css/explore.css">
    <script src="../js/courses.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
</head>

<body>

    <!-- Navbar -->
    <div id="header-placeholder"></div>


    <main>

        <section class="container mt-custom">
            <div class="explore-header">
                <h1 class="explore-title">Explore All Courses</h1>
                <p class="explore-subtitle">Discover 120+ courses and workshops to enhance your skills</p>
            </div>
        </section>

        <section class="container py-custom">
            <div class="explore-layout">

                <aside class="filters-sidebar">
                    <div class="filter-section">
                        <h3 class="filter-title">Category</h3>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="checkbox" name="category" value="all" checked>
                                <span>All Categories</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="category" value="technology">
                                <span>Technology</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="category" value="business">
                                <span>Business</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="category" value="design">
                                <span>Design</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="category" value="data-science">
                                <span>Data Science</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section">
                        <h3 class="filter-title">Type</h3>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="checkbox" name="type" value="all" checked>
                                <span>All Types</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="type" value="online">
                                <span>Online Courses</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="type" value="onsite">
                                <span>On-site Workshops</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section">
                        <h3 class="filter-title">Level</h3>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="checkbox" name="level" value="beginner">
                                <span>Beginner</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="level" value="intermediate">
                                <span>Intermediate</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="level" value="advanced">
                                <span>Advanced</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section">
                        <h3 class="filter-title">Price Range</h3>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="checkbox" name="price" value="0-500">
                                <span>0 - 500 SAR</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="price" value="500-1000">
                                <span>500 - 1000 SAR</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="price" value="1000+">
                                <span>1000+ SAR</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section">
                        <h3 class="filter-title">Language</h3>
                        <div class="filter-options">
                            <label class="filter-option">
                                <input type="checkbox" name="language" value="english">
                                <span>English</span>
                            </label>
                            <label class="filter-option">
                                <input type="checkbox" name="language" value="arabic">
                                <span>Arabic</span>
                            </label>
                        </div>
                    </div>
                </aside>

                <div class="courses-content">
                    <div class="courses-header">
                        <p class="results-count">Showing 120 courses</p>
                        <div class="sort-dropdown">
                            <label for="sort">Sort by:</label>
                            <select id="sort" class="sort-select">
                                <option value="popular">Most Popular</option>
                                <option value="newest">Newest</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="rating">Highest Rated</option>
                            </select>
                        </div>
                    </div>

                    <div class="product-grid" id="course-container" data-limit="0">

                    </div>

                    <div class="pagination">
                        <button class="pagination-btn" disabled>
                            <span class="material-symbols-outlined">chevron_left</span>
                        </button>
                        <button class="pagination-btn active">1</button>
                        <button class="pagination-btn">2</button>
                        <button class="pagination-btn">3</button>
                        <button class="pagination-btn">4</button>
                        <button class="pagination-btn">5</button>
                        <button class="pagination-btn">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

</body>

</html>
