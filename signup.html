<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Taliq</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Unified Global Stylings -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="split-layout">

        <!-- Left Side: Sign Up Form area -->
        <div class="login-pane">
            <div class="login-content">

                <a href="welcome_page.html" class="brand-logo">Taliq</a>
                <h1 class="login-title">Create your account</h1>
                <p class="login-subtitle">Join us today to unlock a universe of expert-led courses.</p>
                <br>

                <!-- Form Section -->
                <form action="post" class="login-form">

                    <!-- Full Name Field -->
                    <div class="input-group">
                        <label for="name" class="input-label">Full Name</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">person</span>
                            <input type="text" id="name" class="form-input" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="input-group">
                        <label for="email" class="input-label">Email Address</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">mail</span>
                            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="password" class="input-label">Password</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">lock</span>
                            <input type="password" id="password" class="form-input" placeholder="Create a password" required>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="input-group">
                        <label for="confirm-password" class="input-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">verified_user</span>
                            <input type="password" id="confirm-password" class="form-input" placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <!-- Terms checkbox -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" class="checkbox" required>
                            <span>I agree to the <a href="#" class="forgot-link">Terms</a> & <a href="#" class="forgot-link">Privacy Policy</a></span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit">Sign Up</button>

                </form>

                <p class="signup-prompt">
                    Already have an account? <a href="user_login.html" class="signup-link">Log in</a>
                </p>

            </div>
        </div>

        <!-- Right Side: Minimalist Image -->
        <div class="image-pane">
            <img src="images/login_illustration.png" alt="Custom Flat Illustration of Learning Platform"
                class="pane-image" style="object-fit: contain; background-color: var(--surface); padding: 4rem;">
        </div>

    </div>

</body>

</html>
