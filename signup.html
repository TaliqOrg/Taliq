<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Taleeq</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Global Stylings -->
    <link rel="stylesheet" href="css/welcome_page.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>


    <header class="main-header">

        <!-- Naviation Bar -->
        <nav class="container nav-container">

            <!-- website's Name -->
            <a href="welcome_page.html" class="logo">Taleeq</a>

            <!-- Search Bar -->
            <div class="nav-search">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" placeholder="Search courses..." class="search-input">
            </div>

            <!-- navigation links -->
            <div class="desktop-nav">
                <a href="explore.html" class="nav-link">Explore</a>
                <a href="contact.html" class="nav-link">Contact Us</a>
                <a href="login.html" class="nav-link nav-login">Log in</a>
                <a href="signup.html" class="nav-link nav-signup">Sign up</a>
            </div>

            <!-- shopping cart button -->
            <a href="Cart.html" class="cart-btn" style="margin: 1rem;">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span class="cart-badge"></span> </a>
        </nav>
    </header>


    <main class="split-layout">

        <!-- Sign Up Form area -->
        <div class="login-pane">
            <div class="login-content">

                <h1 class="login-title">Create your account</h1>
                <p class="login-subtitle">Join us today to unlock a universe of professional courses.</p>
                <br>

                <!-- Form Section -->
                <form action="user_home.html" class="login-form">

                    <!-- Full Name Field -->
                    <div class="input-group">
                        <label for="name" class="input-label">Full Name</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">person</span>
                            <input type="text" id="name" class="form-input" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="input-group">
                        <label for="email" class="input-label">Email Address</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">mail</span>
                            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="input-group">
                        <label for="password" class="input-label">Password</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">lock</span>
                            <input type="password" id="password" class="form-input" placeholder="Create a password"
                                required>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="input-group">
                        <label for="confirm-password" class="input-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">verified_user</span>
                            <input type="password" id="confirm-password" class="form-input"
                                placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <!-- Terms checkbox -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" class="checkbox" required>
                            <span>I agree to the <a href="#" class="forgot-link">Terms</a> & <a href="#"
                                    class="forgot-link">Privacy Policy</a></span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit">Sign Up</button>

                </form>

                <p class="signup-prompt">
                    Already have an account? <a href="login.html" class="signup-link">Log in</a>
                </p>

            </div>
        </div>

        <!-- Image Area -->
        <div class="image-pane">
            <img src="images/login_image.png" alt="Custom Flat Illustration of Learning Platform"
                class="pane-image" style="object-fit: contain; background-color: var(--surface); padding: 4rem;">
        </div>

    </main>

</body>
</html>
